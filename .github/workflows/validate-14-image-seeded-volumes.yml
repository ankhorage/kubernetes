name: Validate image-seeded volumes

on:
  push:
    branches:
      - feat/14-image-seeded-volumes
    paths:
      - '.github/workflows/validate-14-image-seeded-volumes.yml'
      - 'package.json'
      - 'bun.lock'
      - 'src/**'
      - '.changeset/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/14-image-seeded-volumes
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Resolve released Contracts baseline
        run: bun update @ankhorage/contracts@^19.4.0
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - name: Check changeset
        run: |
          git branch main origin/main
          bun run changeset
      - run: bun run format
      - run: bun run test
      - run: bun run docs
      - run: bun run format
      - run: bun run format:check
      - name: Persist validated baseline
        run: |
          rm .github/workflows/validate-14-image-seeded-volumes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock src .changeset README.md paradox .github/workflows/validate-14-image-seeded-volumes.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: persist image-seeded volume baseline'
          git push origin HEAD:feat/14-image-seeded-volumes
